name: MyAnki APKG Validation Tests

on:
  push:
    branches:
      - design-v1
  pull_request:
    branches:
      - design-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-apkg:
    name: Test APKG Validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run APKG validation tests
        run: node --test tests/validateApkg.test.mjs
